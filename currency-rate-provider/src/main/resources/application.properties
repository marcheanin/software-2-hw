spring.profiles.default=dev

grpc.server.port=9090
grpc.server.host=
zookeeper.address=localhost:2181
service.name=currency-service
spring.application.name=currency-rate-provider

# Graceful JVM / Spring shutdown (HTTP + Actuator share the embedded server).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=25s

# gRPC server shutdown (used by GrpcServerRunner); keep <= spring.lifecycle.timeout-per-shutdown-phase.
app.grpc.server.shutdown-grace-seconds=20
app.grpc.server.shutdown-force-seconds=5

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.grpc.server.duration=true

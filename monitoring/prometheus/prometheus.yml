global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: provider-1
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [provider-1:8080]

  - job_name: provider-2
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [provider-2:8080]

  - job_name: provider-3
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [provider-3:8080]

  - job_name: consumer
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [consumer:8080]

  - job_name: zookeeper-jmx
    static_configs:
      - targets: [zookeeper:9404]

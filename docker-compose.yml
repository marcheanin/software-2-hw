services:
  zookeeper:
    build:
      context: .
      dockerfile: monitoring/zookeeper/Dockerfile
    ports:
      - "2181:2181"
      - "9404:9404"
    environment:
      ZOO_MY_ID: 1
      JMXPORT: 9999
      JMXAUTH: "false"
      JMXSSL: "false"
      JMXDISABLE: "false"

  provider-1:
    image: usdrub-rpc/currency-rate-provider:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: currency-rate-provider/Dockerfile
    stop_grace_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GRPC_SERVER_PORT: 9090
      ZOOKEEPER_ADDRESS: zookeeper:2181
      SPRING_APPLICATION_NAME: provider-1
    ports:
      - "18081:8080"
    depends_on:
      - zookeeper

  provider-2:
    image: usdrub-rpc/currency-rate-provider:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: currency-rate-provider/Dockerfile
    stop_grace_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GRPC_SERVER_PORT: 9090
      ZOOKEEPER_ADDRESS: zookeeper:2181
      SPRING_APPLICATION_NAME: provider-2
    ports:
      - "18082:8080"
    depends_on:
      - zookeeper

  provider-3:
    image: usdrub-rpc/currency-rate-provider:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: currency-rate-provider/Dockerfile
    stop_grace_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GRPC_SERVER_PORT: 9090
      ZOOKEEPER_ADDRESS: zookeeper:2181
      SPRING_APPLICATION_NAME: provider-3
    ports:
      - "18083:8080"
    depends_on:
      - zookeeper

  consumer:
    image: usdrub-rpc/rate-printer:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: rate-printer/Dockerfile
    stop_grace_period: 45s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      ZOOKEEPER_ADDRESS: zookeeper:2181
      SPRING_APPLICATION_NAME: consumer
    ports:
      - "18084:8080"
    depends_on:
      - zookeeper
      - provider-1
      - provider-2
      - provider-3

  prometheus:
    image: prom/prometheus:v2.53.2
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - provider-1
      - provider-2
      - provider-3
      - consumer
      - zookeeper

  grafana:
    image: grafana/grafana:11.1.5
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  pact-postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: pact_broker
    ports:
      - "5432:5432"

  pact-broker:
    image: pactfoundation/pact-broker:latest
    depends_on:
      - pact-postgres
    environment:
      PACT_BROKER_DATABASE_ADAPTER: postgres
      PACT_BROKER_DATABASE_HOST: pact-postgres
      PACT_BROKER_DATABASE_NAME: pact_broker
      PACT_BROKER_DATABASE_USERNAME: pact_broker
      PACT_BROKER_DATABASE_PASSWORD: pact_broker
      PACT_BROKER_DATABASE_PORT: 5432
      PACT_BROKER_LOG_LEVEL: INFO
    ports:
      - "9292:9292"

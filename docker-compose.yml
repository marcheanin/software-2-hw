version: '3.8'

services:
  zookeeper:
    image: zookeeper:3.9
    ports:
      - "2181:2181"
    environment:
      ZOO_MY_ID: 1

  provider-1:
    build:
      context: .
      dockerfile: currency-rate-provider/Dockerfile
    environment:
      GRPC_SERVER_PORT: 9090
      ZOOKEEPER_ADDRESS: zookeeper:2181
    depends_on:
      - zookeeper

  provider-2:
    build:
      context: .
      dockerfile: currency-rate-provider/Dockerfile
    environment:
      GRPC_SERVER_PORT: 9090
      ZOOKEEPER_ADDRESS: zookeeper:2181
    depends_on:
      - zookeeper

  provider-3:
    build:
      context: .
      dockerfile: currency-rate-provider/Dockerfile
    environment:
      GRPC_SERVER_PORT: 9090
      ZOOKEEPER_ADDRESS: zookeeper:2181
    depends_on:
      - zookeeper

  consumer:
    build:
      context: .
      dockerfile: rate-printer/Dockerfile
    environment:
      ZOOKEEPER_ADDRESS: zookeeper:2181
    depends_on:
      - zookeeper
      - provider-1
      - provider-2
      - provider-3

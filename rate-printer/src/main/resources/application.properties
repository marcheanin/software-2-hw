spring.profiles.default=dev

zookeeper.address=localhost:2181
service.name=currency-service
spring.application.name=rate-printer

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=25s

# ManagedChannel shutdown in ServiceDiscoveryClient @PreDestroy
app.grpc.client.channel-shutdown-grace-seconds=10
app.grpc.client.channel-shutdown-force-seconds=5

management.endpoints.web.exposure.include=health,info,prometheus
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.grpc.server.duration=true
